[project]
name = "benchmaxx"
version = "0.1.0"
description = "Near-fine-tune accuracy for decision models from a frozen LLM, a small correction head and a domain gate."
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "safetensors>=0.4",
    "torch>=2.4",
    "tqdm>=4.66",
    "transformers>=5.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
benchmaxx = "benchmaxx.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/benchmaxx"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
